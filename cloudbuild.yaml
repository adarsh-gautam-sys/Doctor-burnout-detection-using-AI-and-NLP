steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/clinicareai/clinicare/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend/'
    timeout: '1800s'

images:
  - 'us-central1-docker.pkg.dev/clinicareai/clinicare/backend:latest'

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
